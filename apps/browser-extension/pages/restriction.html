<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FocusSentinel — Restricted</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      max-width: 480px;
      background: #1e293b;
      border-radius: 12px;
      padding: 32px;
      text-align: center;
    }
    h1 { font-size: 20px; margin-bottom: 8px; }
    p { color: #cbd5e1; line-height: 1.5; }
    .meta { text-align: left; background: #0f172a; border-radius: 8px; padding: 12px 16px; margin: 16px 0; font-size: 14px; }
    .meta div { margin: 4px 0; }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 14px;
      cursor: pointer;
      margin: 4px;
    }
    button.secondary { background: transparent; border: 1px solid #475569; }
    #extension-form { display: none; text-align: left; margin-top: 16px; }
    #extension-form select, #extension-form textarea, #extension-form input {
      width: 100%; margin: 6px 0 12px; padding: 8px; border-radius: 6px; border: 1px solid #334155;
      background: #0f172a; color: #f1f5f9;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>This activity is restricted for now</h1>
    <p id="reason-text">Loading...</p>
    <div class="meta">
      <div><strong>Activity:</strong> <span id="identifier"></span></div>
      <div><strong>Available again:</strong> <span id="reset-time">—</span></div>
    </div>
    <button id="request-time-btn">Request more time</button>
    <button class="secondary" id="parent-pin-btn">I'm a parent/guardian</button>

    <form id="extension-form">
      <label>How many minutes?</label>
      <select id="minutes">
        <option value="5">5 minutes</option>
        <option value="10">10 minutes</option>
        <option value="15">15 minutes</option>
        <option value="30">30 minutes</option>
      </select>
      <label>Why do you need more time?</label>
      <select id="reason">
        <option value="friends">Playing with friends</option>
        <option value="special_event">Special event</option>
        <option value="school_related">School-related use</option>
        <option value="technical_issue">Technical issue</option>
        <option value="other">Other</option>
      </select>
      <label>Anything else to add? (optional)</label>
      <textarea id="explanation" rows="2"></textarea>
      <button type="submit">Send request</button>
    </form>
    <p id="status-text"></p>
  </div>
  <script type="module" src="restriction.js"></script>
</body>
</html>
